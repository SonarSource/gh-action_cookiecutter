name: Port Cookiecutter Action
description: GitHub action to create repositories templated with Cookiecutter with Port integration
author: port-labs
inputs:
  token:
    description: 'The GitHub Token to use to authenticate with the API with permissions to create repositories within the organization (supporting only PATs at this time)'
    required: true
  portClientId:
    description: 'The Port Client ID to use to authenticate with the API'
    required: true
  portClientSecret:
    description: 'The Port Client Secret to use to authenticate with the API'
    required: true
  blueprintIdentifier:
    description: 'The blueprint identifier to use to populate the Port'
    required: true
    default: 'Service'
  repositoryName:
    description: 'The name of the repository to create'
    required: true
  repositoryVisibility:
    description: 'The visibility of the repository to create'
    required: false
    default: 'private'
  organizationName:
    description: 'The name of the organization to create the repository in'
    required: true
  cookiecutterTemplate:
    description: 'The cookiecutter template to use to populate the repository'
    required: true
  portUserInputs:
    description: 'Port user inputs to came from triggering the action'
    required: true
  githubURL:
    description: 'Git URL for self hosted version. Default value is api.github.com'
    required: true
    default: 'https://api.github.com'
  portRunId:
    description: 'Port run ID to came from triggering the action'
    required: true
  monorepoUrl:
    description: 'The URL of the monorepo to create the new service in, specify it alongside scaffoldDirectory to open a new pull-request in the monorepo'
    required: false
  scaffoldDirectory:
    description: 'The directory to scaffold the cookiecutter template in'
    required: false
  templateDirectory:
    description: 'The directory to scaffold the cookiecutter template from'
    required: false
  createPortEntity:
    description: 'Whether to create a Port entity for the repository'
    required: false
    default: "true"
  addLinkToPort:
    description: 'Whether to add a link to the repository in Port'
    required: false
    default: "true"
outputs:
  repoURL:
    description: 'The URL of the created repository'
    value: ${{ steps.scaffold.outputs.repoURL }}
runs:
  using: composite
  steps:
    - name: Docker Hub credentials
      id: dockerhub
      uses: SonarSource/vault-action-wrapper@v3
      with:
        secrets: |
          development/kv/data/docker/sonardocker login | username;
          development/kv/data/docker/sonardocker access_token_ro | token;
    - name: Login to Docker Hub
      uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
      with:
        username: ${{ fromJSON(steps.dockerhub.outputs.vault).username }}
        password: ${{ fromJSON(steps.dockerhub.outputs.vault).token }}
    - name: Build the scaffolding image
      id: build
      shell: bash
      run: |
        image="gh-action-cookiecutter:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        docker build --tag "$image" "$GITHUB_ACTION_PATH"
        echo "image=$image" >> "$GITHUB_OUTPUT"
    - name: Scaffold the repository
      id: scaffold
      shell: bash
      env:
        IMAGE: ${{ steps.build.outputs.image }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_PORTCLIENTID: ${{ inputs.portClientId }}
        INPUT_PORTCLIENTSECRET: ${{ inputs.portClientSecret }}
        INPUT_BLUEPRINTIDENTIFIER: ${{ inputs.blueprintIdentifier }}
        INPUT_REPOSITORYNAME: ${{ inputs.repositoryName }}
        INPUT_REPOSITORYVISIBILITY: ${{ inputs.repositoryVisibility }}
        INPUT_ORGANIZATIONNAME: ${{ inputs.organizationName }}
        INPUT_COOKIECUTTERTEMPLATE: ${{ inputs.cookiecutterTemplate }}
        INPUT_PORTUSERINPUTS: ${{ inputs.portUserInputs }}
        INPUT_GITHUBURL: ${{ inputs.githubURL }}
        INPUT_PORTRUNID: ${{ inputs.portRunId }}
        INPUT_MONOREPOURL: ${{ inputs.monorepoUrl }}
        INPUT_SCAFFOLDDIRECTORY: ${{ inputs.scaffoldDirectory }}
        INPUT_TEMPLATEDIRECTORY: ${{ inputs.templateDirectory }}
        INPUT_CREATEPORTENTITY: ${{ inputs.createPortEntity }}
        INPUT_ADDLINKTOPORT: ${{ inputs.addLinkToPort }}
      run: '"$GITHUB_ACTION_PATH/scripts/run-container.sh" "$IMAGE"'
